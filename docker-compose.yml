services:

  db:
    image: mysql:8.4
    container_name: clienthub-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - clienthub-mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - clienthub-network

  api:
    build:
      context: ./api
    container_name: clienthub-api
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "8012:5000"
    depends_on:
      - db
    networks:
      - clienthub-network

  web:
    image: nginx:latest
    container_name: clienthub-web
    ports:
      - "8080:80"
    volumes:
      - ./site:/usr/share/nginx/html
    networks:
      - clienthub-network

volumes:
  clienthub-mysql-data:

networks:
  clienthub-network:
    driver: bridge